org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.caching.debug=false
org.gradle.configuration-cache=false

# Skip Loom's Mercury source-remapping of Fabric API sub-jars on Windows.
# The source-remap step is a Windows file-handle race that fails
# intermittently on multi-version Stonecutter builds (esp. 1.21.11).
# CI mode makes Loom skip downloading/remapping dep sources entirely.
# Trade-off: IDE navigation to fabric-api sources uses intermediary names
# instead of yarn names. Only enable this if you don't need that.
systemProp.fabric.loom.ci=true

# Mod Properties
mod.id=soundscape
mod.name=Soundscape
mod.version=1.0.4
mod.group=net.cozystudios.soundscape
mod.description=Enhance your Minecraft experience with immersive soundscapes
